    <ellipse class="orbit orbit--rev" style="transform-origin:186px 273px"
             cx="186" cy="273" rx="116.96" ry="154.36" fill="none"
             stroke="#8b949e" stroke-width="1" stroke-dasharray="28 24" opacity="0.10"/>

